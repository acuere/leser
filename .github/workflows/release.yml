name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: "0"

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: build matrix (static, reproducible)
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          LD="-s -w -buildid= -X leser/internal/buildinfo.Version=${VERSION} -X leser/internal/buildinfo.Commit=${COMMIT}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$LD" \
              -o "dist/leser_${os}_${arch}" ./cmd/leser
          done
          ( cd dist && sha256sum leser_* > checksums.txt )
          cat dist/checksums.txt

      - name: SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -output dist/sbom.json

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/leser_*
            dist/checksums.txt
            dist/sbom.json

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/acuere/leser:${{ github.ref_name }}
            ghcr.io/acuere/leser:latest
